<!doctype html>
<html lang="en"><head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=1920, height=1080" />
  <script src="vendor/gsap.min.js"></script>
  <style>
    @font-face { font-family: "Space Grotesk"; src: url("fonts/space-grotesk-latin-700-normal.woff2") format("woff2"); font-weight: 700; }
    @font-face { font-family: "Space Grotesk"; src: url("fonts/space-grotesk-latin-500-normal.woff2") format("woff2"); font-weight: 500; }
    @font-face { font-family: "JetBrains Mono"; src: url("fonts/jetbrains-mono-latin-400-normal.woff2") format("woff2"); font-weight: 400; }
    html, body { margin: 0; width: 1920px; height: 1080px; overflow: hidden; background: #05060A; }
    #root { position: relative; width: 1920px; height: 1080px; }
    .scene { position: absolute; inset: 0; }
    canvas { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; }
    .preload { position: absolute; left: 0; top: 0; opacity: 0.01; font-size: 8px; color: #05060A; }
  </style>
</head>
<body>
  <div id="root" data-composition-id="main" data-start="0" data-duration="{{DURATION}}" data-width="1920" data-height="1080">
    <section id="stage" class="scene clip" data-start="0" data-duration="{{DURATION}}" data-track-index="0">
      <canvas id="c" width="1920" height="1080"></canvas>
      <span class="preload" style="font-family: 'Space Grotesk'; font-weight: 700;">A</span>
      <span class="preload" style="font-family: 'Space Grotesk'; font-weight: 500;">A</span>
      <span class="preload" style="font-family: 'JetBrains Mono'; font-weight: 400;">A</span>
    </section>
  </div>
  <script>window.CONTENT = {{CONTENT}};</script>
  <script>
{{SCRIPT}}
  </script>
</body></html>
