<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=1920, height=1080" />
  <script src="vendor/gsap.min.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { margin: 0; width: 1920px; height: 1080px; overflow: hidden; background: {{BG}}; }
    #root { position: relative; width: 1920px; height: 1080px; overflow: hidden; background: {{BG}}; font-family: '{{MONO}}', monospace; }
    #stage { position: absolute; inset: 0; }
    #stage > div { transform-origin: 50% 50%; }
  </style>
</head>
<body>
  <div id="root" data-composition-id="main" data-start="0" data-duration="{{DURATION}}" data-width="1920" data-height="1080">
    <section id="stage" class="clip" data-start="0" data-duration="{{DURATION}}" data-track-index="0"></section>
  </div>
  <script>window.CONTENT = {{CONTENT}};</script>
  <script>
{{SCRIPT}}
  </script>
</body>
</html>
