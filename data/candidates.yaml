# v2 backlog: styles seen in research that do not yet meet the v1 bar
# (2+ independent public examples, code-reproducible, buildable from the skill alone).
# Each entry records what is missing and where it could still be the best choice.
# Promote an entry by adding evidence, writing data/styles/<id>.yaml + skill/references/styles/<id>.md,
# and producing a verified template.

- id: chat-social-ui
  name: {en: Chat & Social UI Story, zh: 聊天与社交界面故事}
  signature: Fake chat threads, notifications, tweets or ChatGPT exchanges animating message by message.
  suggested_tool: hyperframes
  missing: Evidence is component libraries and gallery tag counts, not described finished videos by named creators.
  niche: Story-driven shorts, AI product demos that show a conversation, meme formats.
  evidence:
    - {url: https://github.com/heygen-com/hyperframes/tree/main/registry/blocks, note: "blocks chatgpt-exchange, x-post, message-thread-reveal, slack-notification-ad", verified: opened}
    - {url: https://github.com/iart-ai/motion-skills, note: "text-message story pack (vendor-linked)", verified: opened}
    - {url: https://prompt-motion.com, note: "'Phone' tag, 22 videos", verified: opened}

