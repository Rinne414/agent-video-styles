# Looks found during research that are deliberately NOT catalogued as styles, with the reason.
# Everything else from the research is a core or experimental style in data/styles/.

- id: parody-meme-launch
  name: {en: Parody / Meme Launch, zh: 恶搞发布片}
  signature: Mock-serious launch film for a fake or absurd product.
  suggested_tool: remotion
  missing: This is a tone, not a visual style. Build it with saas-launch-promo or apple-keynote-minimal and write the copy as a parody.
  niche: Community humor, brand engagement posts.
  evidence:
    - {url: https://skillry.dev/ai-videos/opus-5-5, note: "@MaxHirsch13, @Alex_Leiro, @asei_ikarashi", verified: aggregator}

- id: film-era-styles
  name: {en: Film-Era Looks, zh: 电影年代风格}
  signature: Silent-film, Technicolor, war-film and other cinematic era looks drawn entirely in code.
  suggested_tool: html-capture
  missing: A whole family of cinematic illustration looks that one author has already catalogued in depth; duplicating it here would add little. Use the source directly.
  niche: Short films and storytelling experiments.
  evidence:
    - {url: https://github.com/lemomo-ai/lemo-opuscar, note: "43 film styles + 98 Best Picture styles with reusable JSON style prompts", verified: opened}
