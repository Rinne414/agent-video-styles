# Groups shown as film strips on the gallery. Every core style must appear exactly once.
- id: launch
  name:
    en: Launch and brand
    zh: 发布与品牌
  blurb:
    en: Promos, reels and intros that sell a product or a name.
    zh: 推广产品或品牌的宣传片、混剪与片头。
  ids: [saas-launch-promo, apple-keynote-minimal, ui-camera-tour, cinematic-hud-reel, procedural-3d-sting, kinetic-typography]
- id: explain
  name:
    en: Explain and teach
    zh: 讲解与教学
  blurb:
    en: Narrated or self-explaining videos built around an idea, data or code.
    zh: 围绕概念、数据或代码展开的讲解视频。
  ids: [dark-diagram-explainer, card-explainer, data-story-charts, math-manim, code-terminal-walkthrough]
- id: social
  name:
    en: Shorts and footage
    zh: 短视频与素材包装
  blurb:
    en: Caption-led shorts, character talk and packaging for footage you filmed.
    zh: 字幕驱动的短视频、角色对话，以及为实拍素材做包装。
  ids: [karaoke-caption-short, talking-head-overlay, character-dialogue]
- id: illustrated
  name:
    en: Illustrated
    zh: 插画风
  blurb:
    en: Drawn worlds made entirely in code.
    zh: 完全用代码画出来的世界。
  ids: [flat-cartoon-explainer, pixel-retro, painterly-canvas, paper-cut-collage]
- id: experimental
  name:
    en: Experimental
    zh: 实验性
  blurb:
    en: Fewer public examples so far. Each one was still built and checked from its recipe, and some are the best choice for a narrow job.
    zh: 公开案例较少，但每一种都按配方实际做过并检查过，其中有些在特定场景下是最佳选择。
  ids: [chat-social-ui, broadcast-news, whiteboard-handwriting, line-reveal-story, isometric-explainer, glitch-vfx, audiogram-visualizer, abstract-generative-loop, storybook-picture-book, visual-journalism, icon-burst-title, vintage-sketch, social-carousel-cards, product-turntable-3d, editorial-swiss, map-geo-story]
