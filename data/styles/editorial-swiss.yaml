id: editorial-swiss
tier: experimental
evidence_strength: weak
name:
  en: Editorial Swiss Grid
  zh: 瑞士网格编辑风
tagline:
  en: A strict modular grid, flush-left grotesk, giant numerals, hairline rules and one signal color - print design in motion.
  zh: 严格的模块网格、左对齐无衬线字、巨大数字、细线分隔与单一信号色——会动的印刷设计。
signature:
  en:
    - Off-white paper or ink-black ground on a visible 12-column logic
    - Flush-left, ragged-right grotesk headlines and 300-480 px numerals
    - Hairline rules drawing across columns, section numbers and small uppercase labels
    - Blocks sliding exactly by column widths; color-block wipes in one signal color
  zh:
    - 米白纸面或墨黑底色，遵循清晰的 12 栏逻辑
    - 左对齐、右侧参差的无衬线标题，300-480 px 的巨大数字
    - 跨栏绘出的细线、章节编号与小号大写标签
    - 区块按栏宽精确滑动，用单一信号色做色块转场
best_for:
  en:
    - Reports, annual summaries, research findings and statistics
    - Design studios, publications, cultural events and portfolios
  zh:
    - 报告、年度总结、研究发现与统计数据
    - 设计工作室、出版物、文化活动与作品集
avoid_when:
  en:
    - The data is the story and needs charts (use data-story-charts)
    - The audience expects high-energy social pacing (use kinetic-typography)
    - A news-photo look with highlighter strokes is wanted (use visual-journalism)
  zh:
    - 数据本身就是主角、需要图表（改用 data-story-charts）
    - 观众期待高能量的社交节奏（改用 kinetic-typography）
    - 想要带荧光笔划线的新闻图片风（改用 visual-journalism）
tags:
  use: [data-report, brand-reel, explainer]
  platform: [linkedin, youtube, website-hero, x]
  aspect: ["16:9", "4:5"]
  audio: [music, voiceover]
  mood: [editorial, calm]
  needs: [script]
duration: 20-60 s
difficulty: 2
tools:
  primary: hyperframes
  alternatives: [remotion]
  why:
    en: CSS grid gives exact column math, and HyperFrames ships official editorial frame presets and themes (biennale-yellow, cobalt-grid, bold-poster, editorial.css). Remotion works if the grid is computed in a helper.
    zh: CSS grid 能精确计算栏位，HyperFrames 官方自带编辑风画面预设与主题（biennale-yellow、cobalt-grid、bold-poster、editorial.css）。Remotion 用辅助函数计算网格同样可行。
variants:
  - id: bold-poster
    en: Signal-color ground, type cropped off the frame edges, one numeral per shot.
    zh: 信号色底，文字裁出画面边缘，每镜一个数字。
  - id: dark-editorial
    en: "#111111 ground, #EDEBE6 type, the same grid and rules."
    zh: "#111111 底色、#EDEBE6 文字，网格与细线不变。"
