    tool: Claude Code + Remotion skills
    note: 30 s Product Hunt video for YouThumb.ai; short conversational edits for transitions, logo and brand colors.
    verified: opened
  - creator: Sabrina Ramonov
    platform: Substack
    region: en
    url: https://www.sabrina.dev/p/5-insane-claude-code-video-prompts
    tool: Claude Code + Remotion
    note: Prompt "product URL to launch ad" - dark background, brand-color glow, cursor-driven mock UI, particle burst.
    verified: opened
  - creator: "@EnvolDev"
    platform: X
    region: global
    url: https://x.com/EnvolDev/status/2107547689819017555
    tool: Opus 5.5 + Remotion
    note: TopSlash launch, 57 s, "no video editor, only code".
    verified: aggregator
  - creator: Yuto Shintani (AUN Tech Blog)
