    platform: Substack
    region: en
    url: https://www.sabrina.dev/p/5-insane-claude-code-video-prompts
    tool: Claude Code + Remotion
    note: A prompt template asking for self-drawing diagrams via SVG stroke-dashoffset, not a finished whiteboard video. There are no finished examples for this style.
    verified: snippet
  - creator: HyperFrames registry
    platform: GitHub
    region: US
    url: https://github.com/heygen-com/hyperframes/tree/main/registry
    tool: HyperFrames
    note: Component library, not a finished video; hw-* handwriting components and whiteboard-ink.
    verified: opened
  - creator: iart-ai
    platform: GitHub
    region: unknown
    url: https://github.com/iart-ai/awesome-motion-skills
    tool: Claude Code skills
    note: Skill pack, not a finished video; includes whiteboard and isometric explainer packs.
    verified: opened
  - creator: cth9191
    platform: GitHub
    region: unknown
    url: https://github.com/cth9191/animate
