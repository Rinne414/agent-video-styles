    note: 30 s, 7-page rabbit National Day story; noise-generated watercolor paper, hand-drawn wobble, page-turn audio, music-box arpeggio. Described in the article, no media link.
    verified: opened
  - creator: des13 (Claude Code, published by 益盛科技)
